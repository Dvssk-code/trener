# Blueprint для Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: vibeclass
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: YANDEX_API_KEY
        sync: false
      - key: YANDEX_FOLDER_ID
        sync: false
      - key: BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
