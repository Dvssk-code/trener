<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeClass — урок вайб-кодинга</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<main class="hero">
  <div class="badge">Интерактивный урок</div>
  <h1 class="logo">Vibe<span>Class</span></h1>
  <p class="tagline">Учитель показывает, как программа пишется словами.<br>
  Ученики строят свою мобильную игру, прося об этом ИИ.</p>
  <div class="roles">
    <a class="role-card" href="/teacher">
      <div class="role-icon">🧑‍🏫</div>
      <div class="role-name">Учитель</div>
      <div class="role-desc">Смотри демонстрацию урока и игры команд</div>
    </a>
    <a class="role-card" href="/student">
      <div class="role-icon">🧑‍🎓</div>
      <div class="role-name">Ученик</div>
      <div class="role-desc">Выбери команду и создай свою мобильную игру</div>
    </a>
  </div>
  <p class="hint">Отлично работает с телефона 📱</p>
</main>
</body>
</html>
